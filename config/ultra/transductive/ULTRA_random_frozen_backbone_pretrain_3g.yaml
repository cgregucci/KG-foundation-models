output_dir: ~/KGFM/output

dataset:
  class: JointDataset
  graphs: [FB15k237, WN18RR, CoDExMedium]
  root: ~/KGFM/kg-datasets/

model:
  class: Ultra
  random_init_seed: 12345
  freeze_except_trainable_prefixes: true
  trainable_module_prefixes: ["entity_model.mlp"]
  relation_model:
    class: NBFNet
    input_dim: 64
    hidden_dims: [64, 64, 64, 64, 64, 64]
    message_func: distmult
    aggregate_func: sum
    short_cut: yes
    layer_norm: yes
    use_triton: no
  entity_model:
    class: IndNBFNet
    input_dim: 64
    hidden_dims: [64, 64, 64, 64, 64, 64]
    message_func: distmult
    aggregate_func: sum
    short_cut: yes
    layer_norm: yes
    use_triton: no
task:
  name: MultiGraphPretraining
  num_negative: 512
  strict_negative: yes
  adversarial_temperature: 1
  metric: [mr, mrr, hits@1, hits@3, hits@10]

optimizer:
  class: AdamW
  lr: 5.0e-4

train:
  gpus: {{ gpus }}
  batch_size: 64
  num_epoch: 10
  log_interval: 800
  batch_per_epoch: 80000
  fast_test: 500
